<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120b09" />
    <title>Dig Don</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="play">
        <header id="hud" hidden>
          <div class="hud-left">
            <div class="hud-score">SCORE <b id="hud-score">000000</b></div>
            <div class="hud-hi">HI <b id="hud-hi">000000</b></div>
          </div>
          <div class="hud-mid">
            <div id="hud-level">LEVEL 1 · ROUND 1</div>
            <div><span id="hud-goal">DIRT 0</span> <span id="hud-lives" aria-label="lives"></span></div>
          </div>
          <div class="hud-right">
            <button id="btn-mute" class="icon-btn" aria-label="Sound on or off"></button>
            <button id="btn-pause" class="icon-btn" aria-label="Pause">
              <svg viewBox="0 0 24 24" width="22" height="22"><rect x="5" y="4" width="5" height="16" fill="currentColor"/><rect x="14" y="4" width="5" height="16" fill="currentColor"/></svg>
            </button>
          </div>
        </header>
        <main id="view">
          <canvas id="game" aria-label="Dig Don"></canvas>
          <canvas id="race" aria-label="I can't see!! driving level" hidden></canvas>
          <div id="popups"></div>
          <div id="threats" aria-hidden="true"></div>
          <div id="banner" aria-live="polite"></div>
        </main>
        <footer id="pad" hidden>
          <div id="dpad" aria-label="Move">
            <span class="arrow up"></span><span class="arrow right"></span><span class="arrow down"></span><span class="arrow left"></span>
            <span id="dpad-knob"></span>
          </div>
          <button id="overview" aria-label="Hold for full view" title="Hold for full view" aria-pressed="false">
            <canvas id="overview-map" width="112" height="192" aria-hidden="true"></canvas>
          </button>
          <div id="actions"></div>
        </footer>
        <div id="hint"></div>
      </div>

      <section id="screen-loading" class="screen">
        <canvas class="title" data-text="DIG DON"></canvas>
        <p class="sub">Loading…</p>
      </section>

      <section id="screen-menu" class="screen" hidden>
        <canvas class="title" data-text="DIG DON"></canvas>
        <p class="sub">Mega Don, bricklayer</p>
        <nav class="menu">
          <button data-action="play" class="primary">PLAY</button>
          <details id="level-select">
            <summary>SELECT LEVEL</summary>
            <div class="level-options">
              <button data-action="level-0">LEVEL 1 · DIG DON</button>
              <button data-action="level-1">LEVEL 2 · BRICKLAYER</button>
              <button data-action="level-2">LEVEL 3 · CONGA LINE</button>
              <button data-action="level-3">LEVEL 4 · INVASION</button>
              <button data-action="level-4">LEVEL 5 · I SAID "LEGS"!!</button>
              <button data-action="level-5">LEVEL 6 · SUMMIT</button>
              <button data-action="level-6">LEVEL 7 · I CAN'T SEE!!</button>
            </div>
          </details>
          <label id="summit-coop-option"><input id="summit-coop" type="checkbox" /> SUMMIT · 2 PLAYERS</label>
          <button data-action="leaderboard">LEADERBOARD</button>
          <button data-action="sound" class="sound-toggle">SOUND ON</button>
        </nav>
        <p class="best">HI <b class="best-score">000000</b></p>
        <p class="version"></p>
      </section>

      <section id="screen-pause" class="screen dim" hidden>
        <h2>PAUSED</h2>
        <fieldset id="camera-setting" hidden>
          <legend>CAMERA</legend>
          <label><input type="radio" name="camera" value="focus" />FOCUS</label>
          <label><input type="radio" name="camera" value="fit" />FIT</label>
        </fieldset>
        <nav class="menu">
          <button data-action="resume" class="primary">RESUME</button>
          <button data-action="sound" class="sound-toggle">SOUND ON</button>
          <button data-action="menu">QUIT TO MENU</button>
        </nav>
        <p class="keys">Q to resume · M / Esc for the menu</p>
      </section>

      <section id="screen-over" class="screen dim" hidden>
        <h2 class="over-title">GAME OVER</h2>
        <p class="over-score">SCORE <b id="over-score">0</b></p>
        <p class="over-best" id="over-best"></p>
        <nav class="menu">
          <button data-action="again" class="primary">PLAY AGAIN</button>
          <button data-action="challenge" hidden>CHALLENGE A FRIEND</button>
          <button data-action="share" hidden>SHARE SCORE</button>
          <button data-action="leaderboard">LEADERBOARD</button>
          <button data-action="menu">MENU</button>
        </nav>
      </section>

      <section id="screen-board" class="screen dim" hidden>
        <h2>LEADERBOARD</h2>
        <div class="tabs">
          <button data-scope="friends" class="tab">FRIENDS</button>
          <button data-scope="global" class="tab">EVERYONE</button>
        </div>
        <ol id="board-list"></ol>
        <nav class="menu">
          <button data-action="back" class="primary">BACK</button>
        </nav>
      </section>
    </div>
    <!-- FBINSTANT -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
